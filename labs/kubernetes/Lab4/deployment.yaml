# Define a Kubernetes Pod
apiVersion: v1
kind: Pod
metadata:
  name: pod-example # Specify the name of the Pod
  labels: # Set the labels of the Pod for identification
    app: nginx # Label "app" is set to "nginx" to categorize the Pod
spec:
  containers:
    - name: nginx # Name of the container within the Pod
      image: nginx:stable-alpine # Docker image to use for the container
      ports:
        - containerPort: 80 # Port on which the container will listen
---
# Define a Kubernetes Service
apiVersion: v1
kind: Service
metadata:
  name: nginx-service # Specify the name of the Service
spec:
  selector: # Ensure the selector matches the labels from the Pod (for now ensure a 100% match)
    app: nginx # Selector label matches the "app" label of the Pod
  ports:
    - protocol: TCP
      port: 80 # Port on which the Service listens
      targetPort: 80 # Port on which traffic is forwarded to within the Pods
  type: ClusterIP # Type of Service, in this case, a ClusterIP service
